<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рух кульки</title>
  <style>
    body {
      max-width: 720px;
      margin: 50px auto;
      padding: 0 16px;
      font: 18px system-ui, sans-serif;
      color: #183a36;
    }

    #field {
      position: relative;
      height: 160px;
      overflow: hidden;
      background: #183a36;
      border-radius: 12px;
    }

    #ball {
      position: absolute;
      top: calc(50% - 20px);
      left: 0;
      width: 40px;
      height: 40px;
      background: #ffbd59;
      border-radius: 50%;
    }

    button {
      margin-top: 16px;
      padding: 8px 16px;
      font: inherit;
      cursor: pointer;
    }
    .switch-page {
  display: inline-block;
  margin-bottom: 16px;
  padding: 9px 16px;
  border-radius: 8px;
  background: #183a36;
  color: white;
  text-decoration: none;
}
  </style>
</head>
<body>
    <a class="switch-page" href="game.html">До гри «Злови кульку»</a>
  <h1>Рух кульки</h1>

  <div id="field">
    <div id="ball"></div>
  </div>

  <button id="start">Старт</button>
  <button id="pause">Пауза</button>
  <button id="reset">Скинути</button>

  <script>
    // const оголошує сталі. getElementById знаходить елемент за його id.
    const field = document.getElementById("field");
    const ball = document.getElementById("ball");
    const speed = 180; // Пікселів за секунду.

    // let оголошує змінні. Знак = присвоює значення.
    let position = 0;
    let direction = 1; // 1 — праворуч, -1 — ліворуч.
    let frameId = null; // null означає, що кадр не заплановано.
    let previousTime = null;

    // function оголошує функцію, а фігурні дужки обмежують її тіло.
    function draw() {
      // Крапка дає доступ до властивості. + додає одиницю вимірювання.
      ball.style.left = position + "px";
    }

    // time — параметр. Браузер передає в нього час кадру в мілісекундах.
    function animate(time) {
      // if перевіряє умову. === означає строгу рівність.
      if (previousTime === null) {
        previousTime = time;
      }

      // Віднімання дає час між кадрами. Math.min обмежує його до 50 мс.
      // Ділення на 1000 переводить мілісекунди в секунди.
      const seconds = Math.min(time - previousTime, 50) / 1000;
      previousTime = time;

      // * множить числа, а += додає результат до поточної координати.
      position += direction * speed * seconds;

      const rightEdge = field.clientWidth - ball.offsetWidth;

      // >= і <= включають саму межу. else if перевіряє наступну умову.
      if (position >= rightEdge) {
        position = rightEdge;
        direction = -1;
      } else if (position <= 0) {
        position = 0;
        direction = 1;
      }

      draw(); // Дужки викликають функцію одразу.
      // Передаємо animate без дужок, щоб браузер викликав її на наступному кадрі.
      frameId = requestAnimationFrame(animate);
    }

    function start() {
      // Якщо кадр уже заплановано, повторне натискання нічого не змінить.
      if (frameId === null) {
        frameId = requestAnimationFrame(animate);
      }
    }

    function pause() {
      // !== означає нерівність. Кадр можна скасувати за його номером.
      if (frameId !== null) {
        cancelAnimationFrame(frameId);
      }
      frameId = null;
      previousTime = null;
    }

    function reset() {
      pause();
      position = 0;
      direction = 1;
      draw();
    }

    // addEventListener прив'язує функцію до події "click".
    // Кома розділяє аргументи: назву події та функцію-обробник.
    document.getElementById("start").addEventListener("click", start);
    document.getElementById("pause").addEventListener("click", pause);
    document.getElementById("reset").addEventListener("click", reset);
  </script>
</body>
</html>
